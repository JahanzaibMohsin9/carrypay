name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # RouteContext and LayoutProps are global types generated by Next (git ignores them).
      - name: Typecheck
        run: npx next typegen && npx tsc --noEmit

      - name: Lint
        run: npx eslint src

      - name: Unit tests
        run: npm test

      # Replays the curated live runs in recordings/ through today's tools, safety gateway and rules engine.
      # No API keys: the live eval (npm run eval:live) stays a manual run.
      - name: Eval (replay)
        run: npm run eval:replay
