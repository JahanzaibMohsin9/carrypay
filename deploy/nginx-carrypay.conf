# CarryPay behind an existing nginx (docker-compose.shared.yml runs the app on 127.0.0.1:3010).
# Copy to /etc/nginx/sites-available/carrypay, replace carrypay.example.org with your hostname,
# enable it, then get the certificate:  sudo certbot --nginx -d carrypay.example.org
# (passkeys and installing the app need HTTPS)

server {
    listen 80;
    server_name carrypay.example.org;

    client_max_body_size 10m;   # bill uploads are up to 8 MB

    # the live activity feed is a server-sent event stream: no buffering, long-lived
    location /api/stream {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5m;   # a live agent wake-up can take a minute or two
    }
}
